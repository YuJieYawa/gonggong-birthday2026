<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>献给公公的生日祝福 · 一生戎马，半世蜂甜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#5b8c5a;
    font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    overflow:hidden;
    height:100vh; width:100vw;
    display:flex; justify-content:center; align-items:center;
    user-select:none; -webkit-user-select:none;
  }
  canvas { display:block; position:absolute; top:0; left:0; }
  #startBtn {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    padding:22px 55px; font-size:30px;
    background:linear-gradient(135deg, #f5d742, #ffb347);
    border:none; border-radius:60px; color:#3b2e1e; font-weight:bold;
    cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,0.3);
    letter-spacing:0.1em; z-index:10; transition:all 0.3s;
  }
  #startBtn:hover { background:linear-gradient(135deg, #ffeb7a, #ffc067); transform:translate(-50%,-50%) scale(1.06); }
</style>
</head>
<body>
<button id="startBtn">🐝 开启祝福 🐝</button>
<canvas id="canvas"></canvas>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');

  let W, H;
  let bees = [];
  let flowers = [];
  let petals = [];
  let stage = 'idle';
  let stageStartTime = 0;
  let starPoints = [];
  let textPoints = [];
  let animFrame;
  let musicStarted = false;
  let hiveHoles = [];
  let cachedTextPoints = null;
  let starFormedTime = 0;
  let redPhase = 'none';
  let currentOverlayText = '';

  // ==================== 离屏 canvas 预渲染蜜蜂身体 ====================
  const BEE_SIZE = 50; // 固定画布大小  
  let beeBodyCanvas, beeBodyCtx;

  function renderBeeBody(bodyColor, headColor, stripeColor) {
    beeBodyCanvas = document.createElement('canvas');
    beeBodyCanvas.width = beeBodyCanvas.height = BEE_SIZE;
    beeBodyCtx = beeBodyCanvas.getContext('2d');
    let bctx = beeBodyCtx;
    bctx.save();
    bctx.translate(BEE_SIZE/2, BEE_SIZE/2);

    let bodyAngle = -0.35;

    // 身体
    bctx.save();
    bctx.rotate(bodyAngle);
    bctx.beginPath();
    bctx.ellipse(0, 0, 7.5, 6, 0, 0, Math.PI * 2);
    bctx.clip();
    bctx.fillStyle = bodyColor;
    bctx.beginPath(); bctx.ellipse(0, 0, 7.5, 6, 0, 0, Math.PI * 2); bctx.fill();
    bctx.strokeStyle = stripeColor;
    bctx.lineWidth = 2.5;
    bctx.beginPath(); bctx.moveTo(-2.5, -8); bctx.lineTo(-2.5, 8); bctx.stroke();
    bctx.beginPath(); bctx.moveTo(2.5, -8); bctx.lineTo(2.5, 8); bctx.stroke();
    bctx.restore();

    // 尾刺
    bctx.fillStyle = '#3b2e1e';
    bctx.save();
    bctx.rotate(bodyAngle);
    bctx.beginPath();
    bctx.moveTo(-7, -1.5);
    bctx.lineTo(-10.5, 0);
    bctx.lineTo(-7, 1.5);
    bctx.closePath();
    bctx.fill();
    bctx.restore();

    // 头部
    let headX = 7.0, headY = -2.6 - 2.5;
    bctx.fillStyle = headColor;
    bctx.beginPath(); bctx.arc(headX, headY, 7.5, 0, Math.PI * 2); bctx.fill();

    // 眼睛
    bctx.fillStyle = '#111';
    bctx.beginPath(); bctx.arc(headX - 1, headY - 1.5, 0.9, 0, Math.PI * 2); bctx.fill();
    bctx.beginPath(); bctx.arc(headX + 4.5, headY - 1.5, 0.85, 0, Math.PI * 2); bctx.fill();

    // 嘴
    bctx.strokeStyle = '#3b2e1e';
    bctx.lineWidth = 0.6;
    bctx.lineCap = 'round';
    bctx.beginPath();
    bctx.arc(headX + 1.75, headY + 1, 1.5, 0.3, Math.PI - 0.2);
    bctx.stroke();

    bctx.restore();
  }

  // 预渲染翅膀
  const WING_SIZE = 30;
  let wingCanvas, wingCtx;
  function renderWing(wingColor) {
    wingCanvas = document.createElement('canvas');
    wingCanvas.width = wingCanvas.height = WING_SIZE;
    wingCtx = wingCanvas.getContext('2d');
    let wctx = wingCtx;
    wctx.save();
    wctx.translate(WING_SIZE/2, WING_SIZE/2);
    wctx.fillStyle = wingColor;
    wctx.beginPath();
    wctx.moveTo(-3, 0);
    wctx.bezierCurveTo(-4, -4, 3, -5, 2, 1);
    wctx.bezierCurveTo(1, 4, -2, 2, -3, 0);
    wctx.fill();
    wctx.restore();
  }

  // 初始渲染（默认配色）
  renderBeeBody('#f5c542', '#f5c542', '#3b2e1e');
  renderWing('rgba(255, 255, 255, 0.72)');

  // 暴露给外部更新缓存
  function updateBeeCache(body, head, stripe, wing) {
    renderBeeBody(body, head, stripe);
    renderWing(wing);
  }

  // ==================== 蜜蜂 ====================
  class Bee {
    constructor(x, y) {
      this.x = x; this.y = y;
      this.targetX = x; this.targetY = y;
      this.vx = 0; this.vy = 0;
      this.id = Math.random();
      this.arrived = false;
    }

    setTarget(tx, ty) { this.targetX = tx; this.targetY = ty; this.arrived = false; }

    update() {
      let dx = this.targetX - this.x, dy = this.targetY - this.y, dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 0.8) {
        this.vx += (dx/dist)*0.24; this.vy += (dy/dist)*0.24; this.vx *= 0.93; this.vy *= 0.93; this.arrived = false;
      } else {
        this.vx = 0; this.vy = 0; this.x = this.targetX; this.y = this.targetY; this.arrived = true;
      }
      let speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
      if (speed > 6) { this.vx = (this.vx/speed)*6; this.vy = (this.vy/speed)*6; }
      this.x += this.vx; this.y += this.vy;
    }

    draw(ctx) {
      ctx.save(); ctx.translate(this.x, this.y);
      let wingBeat = this.arrived ? 0 : Math.sin(Date.now() * 0.6 + this.id * 18) * 5.0;
      let beeScale = isPortrait() ? 0.9 : 1.15;
      ctx.scale(beeScale, beeScale);

      let facingRight = true;
      if (!this.arrived) {
        if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) {
          facingRight = this.vx >= 0;
        }
      }
      if (!facingRight) {
        ctx.scale(-1, 1);
      }

      let bodyAngle = -0.35;

      // 前翅
      ctx.save();
      ctx.translate(-2.5, -7);
      ctx.rotate(0.13 + wingBeat * 3.0);
      ctx.scale(1.2, 1.2);
      ctx.drawImage(wingCanvas, -WING_SIZE/2, -WING_SIZE/2);
      ctx.restore();

      // 后翅
      ctx.save();
      ctx.translate(-5, -5.5);
      ctx.rotate(bodyAngle + wingBeat * 3.0);
      ctx.scale(1.2, 1.2);
      ctx.drawImage(wingCanvas, -WING_SIZE/2, -WING_SIZE/2);
      ctx.restore();

      // 身体（离屏 canvas）
      ctx.drawImage(beeBodyCanvas, -BEE_SIZE/2, -BEE_SIZE/2);

      ctx.restore();
    }
  }

  // ==================== 花瓣 ====================
  class Petal {
    constructor() { this.reset(); this.y = Math.random()*H; }
    reset() { this.x=Math.random()*W;this.y=-10;this.size=2+Math.random()*3.5;this.speed=0.15+Math.random()*0.4;this.drift=(Math.random()-0.5)*0.2;this.rot=Math.random()*Math.PI*2;this.rotSpeed=(Math.random()-0.5)*0.012;this.alpha=0.2+Math.random()*0.3; }
    update() { this.y+=this.speed;this.x+=this.drift+Math.sin(this.y*0.03)*0.12;this.rot+=this.rotSpeed;if(this.y>H+15)this.reset(); }
    draw(ctx) { ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.globalAlpha=this.alpha;ctx.fillStyle='#FFE4B5';ctx.beginPath();ctx.ellipse(0,0,this.size,this.size*0.4,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.restore(); }
  }

  // ==================== 花朵 ====================
  function createFlowers() {
    flowers=[];let c=['#FF6B6B','#FFB347','#FFD700','#FF8C94','#FF9999','#FFA07A','#FF69B4','#FF7F50'];
    for(let i=0;i<12;i++){let fx=(i+0.5)*(W/12)+(Math.random()-0.5)*25,gy=H-12,sh=40+Math.random()*50,fy=gy-sh,sz=9+Math.random()*14;flowers.push({x:fx,y:fy,groundY:gy,stemH:sh,size:sz,color:c[i%c.length],phase:Math.random()*Math.PI*2});}
  }
  function drawFlowers(time){flowers.forEach(f=>{let sw=Math.sin(time*0.0007+f.phase)*2.5,tx=f.x+sw,ty=f.y,bx=f.x+sw*0.4,by=f.groundY;ctx.strokeStyle='#3d7a3d';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(tx,ty);ctx.bezierCurveTo(tx+sw*0.6,ty+f.stemH*0.3,bx-sw*0.2,ty+f.stemH*0.65,bx,by);ctx.stroke();ctx.fillStyle='#4CAF50';ctx.beginPath();ctx.ellipse(tx+7,ty+f.stemH*0.3,7,3.2,0.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(tx-6,ty+f.stemH*0.55,6,2.8,-0.3,0,Math.PI*2);ctx.fill();for(let i=0;i<5;i++){let a=(i/5)*Math.PI*2+f.phase*0.3;ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(tx+Math.cos(a)*f.size*0.4,ty+Math.sin(a)*f.size*0.4,f.size*0.35,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#FFF8DC';ctx.beginPath();ctx.arc(tx,ty,f.size*0.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#F4A460';ctx.beginPath();ctx.arc(tx,ty,f.size*0.09,0,Math.PI*2);ctx.fill();});}

  // ==================== 蜂巢 ====================
  let hiveData=[];
  function initHive(){let r=22,cx=60,cy=H-150,gap=r*Math.sqrt(3);hiveData=[{dx:0,dy:0},{dx:0,dy:-gap},{dx:r*1.5,dy:-gap/2},{dx:r*1.5,dy:gap/2},{dx:0,dy:gap},{dx:-r*1.5,dy:gap/2},{dx:-r*1.5,dy:-gap/2}];hiveHoles=hiveData.map(c=>({x:cx+c.dx,y:cy+c.dy}));}
  function drawHive(){let r=22,cx=60,cy=H-150;ctx.save();ctx.fillStyle='#c98a2c';ctx.beginPath();hiveData.forEach(c=>{let hx=cx+c.dx,hy=cy+c.dy;ctx.moveTo(hx+r,hy);for(let i=1;i<6;i++){let a=i*Math.PI/3;ctx.lineTo(hx+Math.cos(a)*r,hy+Math.sin(a)*r);}});ctx.fill();hiveData.forEach((c,idx)=>{let hx=cx+c.dx,hy=cy+c.dy,rr=r*0.98;ctx.fillStyle=idx===0?'#f0d050':'#e8c438';ctx.beginPath();drawHex(hx,hy,rr);ctx.fill();ctx.strokeStyle='#b8860b';ctx.lineWidth=2;ctx.beginPath();drawHex(hx,hy,rr);ctx.stroke();ctx.fillStyle='#a0681a';ctx.beginPath();drawRoundedHex(hx,hy,rr*0.72,rr*0.25);ctx.fill();});ctx.restore();}
  function drawHex(x,y,r){ctx.moveTo(x+r,y);for(let i=1;i<6;i++){let a=i*Math.PI/3;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();}
  function drawRoundedHex(x,y,r,cr){for(let i=0;i<6;i++){let a1=i*Math.PI/3,a2=(i+1)*Math.PI/3,mid=(a1+a2)/2,x1=x+Math.cos(a1)*r,y1=y+Math.sin(a1)*r,x2=x+Math.cos(a2)*r,y2=y+Math.sin(a2)*r,rcx=x+Math.cos(mid)*(r-cr*0.4),rcy=y+Math.sin(mid)*(r-cr*0.4);if(i===0)ctx.moveTo(x+r,y);ctx.quadraticCurveTo(x1,y1,rcx,rcy);ctx.quadraticCurveTo(x2,y2,x+Math.cos(a2)*r,y+Math.sin(a2)*r);}ctx.closePath();}

  // ==================== 卡通树 ====================
  function drawTree() {
    ctx.save();
    let cx=5, cy=H-200;
    ctx.fillStyle='#8B5E3C'; ctx.beginPath();
    ctx.moveTo(cx-28, H); ctx.lineTo(cx+28, H);
    ctx.quadraticCurveTo(cx+14, cy+50, cx+10, cy+10);
    ctx.quadraticCurveTo(cx+8, cy-15, cx+5, cy-30);
    ctx.quadraticCurveTo(cx-5, cy-30, cx-8, cy-15);
    ctx.quadraticCurveTo(cx-12, cy+50, cx-16, H); ctx.fill();
    let greens=['#52a840'];
    let puffs=[
      {x:cx+0,y:cy+0,r:54},{x:cx-70,y:cy-20,r:44},{x:cx+70,y:cy-20,r:44},
      {x:cx-80,y:cy+25,r:40},{x:cx+80,y:cy+25,r:40},{x:cx-45,y:cy+50,r:36},{x:cx+45,y:cy+50,r:36},
      {x:cx-55,y:cy-55,r:38},{x:cx+55,y:cy-55,r:38},{x:cx+0,y:cy-80,r:42},
    ];
    puffs.forEach((p,i)=>{ctx.fillStyle=greens[i%3];ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
    puffs.forEach((p,i)=>{ctx.fillStyle=greens[3+(i%2)];ctx.beginPath();ctx.arc(p.x-3,p.y-4,p.r*0.7,0,Math.PI*2);ctx.fill();});
    ctx.restore();
  }

  // ==================== 五角星点阵 ====================
  function generateStarPoints(cx,cy,or,ir){
    let pts=[],step=3,out=[],inn=[];
    for(let i=0;i<5;i++){let oa=-Math.PI/2+i*(Math.PI*2/5),ia=oa+Math.PI/5;out.push({x:cx+Math.cos(oa)*or,y:cy+Math.sin(oa)*or});inn.push({x:cx+Math.cos(ia)*ir,y:cy+Math.sin(ia)*ir});}
    let verts=[];for(let i=0;i<5;i++){verts.push(out[i]);verts.push(inn[i]);}
    function inS(px,py){let c=0;for(let i=0;i<10;i++){let v1=verts[i],v2=verts[(i+1)%10];if(((v1.y>py)!==(v2.y>py))&&(px<(v2.x-v1.x)*(py-v1.y)/(v2.y-v1.y)+v1.x))c++;}return c%2===1;}
    for(let y=cy-or;y<=cy+or;y+=step)for(let x=cx-or;x<=cx+or;x+=step)if(Math.sqrt((x-cx)**2+(y-cy)**2)>3&&inS(x,y))pts.push({x,y});
    return pts;
  }

  // ==================== 文字点阵 ====================
  function generateTextPoints(text,cx,cy,fs){
    let key=`${text}_${fs}`;
    if(cachedTextPoints&&cachedTextPoints.key===key)return cachedTextPoints.points.map(p=>({x:p.x+(cx-cachedTextPoints.cx),y:p.y+(cy-cachedTextPoints.cy)}));
    let oc=document.createElement('canvas'),octx=oc.getContext('2d'),fstr=`${fs}px "PingFang SC","Microsoft YaHei","SimHei","黑体",sans-serif`;
    octx.font=fstr;let m=octx.measureText(text),tw=m.width,th=fs;oc.width=Math.ceil(tw)+150;oc.height=Math.ceil(th*1.6)+40;
    octx.fillStyle='white';octx.font=fstr;octx.textBaseline='top';octx.fillText(text,75,20);
    let img=octx.getImageData(0,0,oc.width,oc.height),h=oc.height,w=oc.width,bin=new Uint8Array(w*h);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)bin[y*w+x]=img.data[(y*w+x)*4+3]>60?1:0;
    let skel=new Uint8Array(bin);
    for(let iter=0;iter<5;iter++){let ch=false,next=new Uint8Array(skel);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let idx=y*w+x;if(skel[idx]===1){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)n+=skel[(y+dy)*w+(x+dx)];if(n<5&&n>1){next[idx]=0;ch=true;}}}skel=next;if(!ch)break;}
    let pts=[];for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(skel[y*w+x]===1)pts.push({x:cx-tw/2-75+x,y:cy-th/2-20+y});
    cachedTextPoints={key,points:pts.map(p=>({x:p.x,y:p.y})),cx,cy};return pts;
  }

  function sampleEvenly(points,count){
    if(points.length===0)return[];if(count>=points.length){let r=[];for(let i=0;i<count;i++)r.push({...points[i%points.length]});return r;}
    let r=[],step=(points.length-1)/(count-1);for(let i=0;i<count;i++)r.push({...points[Math.min(Math.round(i*step),points.length-1)]});return r;
  }

  function generateTwoLineTextPoints(text1, text2, cx, cy, fs, lineGap) {
    cachedTextPoints = null;
    let pts1 = generateTextPoints(text1, cx, cy - lineGap/2, fs);
    cachedTextPoints = null;
    let pts2 = generateTextPoints(text2, cx, cy + lineGap/2, fs);
    cachedTextPoints = null;
    return [...pts1, ...pts2];
  }

  // ==================== 音乐 ====================
  function playMusic(){if(musicStarted)return;musicStarted=true;try{let AC=window.AudioContext||window.webkitAudioContext,ac=new AC();let mel=[{f:392,d:0.35},{f:392,d:0.35},{f:440,d:0.5},{f:392,d:0.5},{f:523,d:0.5},{f:494,d:0.7},{f:392,d:0.35},{f:392,d:0.35},{f:440,d:0.5},{f:392,d:0.5},{f:587,d:0.5},{f:523,d:0.7},{f:392,d:0.35},{f:392,d:0.35},{f:784,d:0.5},{f:659,d:0.5},{f:523,d:0.5},{f:494,d:0.5},{f:440,d:0.35},{f:698,d:0.35},{f:698,d:0.5},{f:659,d:0.5},{f:523,d:0.5},{f:587,d:0.5},{f:523,d:0.9}];let t=ac.currentTime+0.3;for(let r=0;r<2;r++)mel.forEach(n=>{let o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=n.f;g.gain.setValueAtTime(0.16,t);g.gain.exponentialRampToValueAtTime(0.001,t+n.d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+n.d);t+=n.d;});[262,330,392,523].forEach(f=>{let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.5);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.5);});}catch(e){}}
  function getArrivalRatio(tp,md){let c=Math.min(bees.length,tp.length),arr=0;for(let i=0;i<c;i++){let dx=bees[i].targetX-bees[i].x,dy=bees[i].targetY-bees[i].y;if(Math.sqrt(dx*dx+dy*dy)<md)arr++;}return c>0?arr/c:0;}
  function lerpC(c1,c2,t){let r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16),r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);return'#'+Math.round(r1+(r2-r1)*t).toString(16).padStart(2,'0')+Math.round(g1+(g2-g1)*t).toString(16).padStart(2,'0')+Math.round(b1+(b2-b1)*t).toString(16).padStart(2,'0');}
  function lerpA(a1,a2,t){return a1+(a2-a1)*t;}

  function isPortrait() { return W < H; }
  function isMobile() {
    let ua = navigator.userAgent || navigator.vendor || window.opera;
    return /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini|HarmonyOS|OpenHarmony/i.test(ua);
  }

  // ==================== 背景 ====================
  function drawBackground(time){
    let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#87CEEB');grad.addColorStop(0.4,'#B0E0E6');grad.addColorStop(0.68,'#b8d9a8');grad.addColorStop(0.88,'#6aaa6a');grad.addColorStop(1,'#4e8c4e');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.5)';[{x:W*0.2,y:H*0.08},{x:W*0.55,y:H*0.05},{x:W*0.85,y:H*0.1}].forEach(c=>{let s=Math.sin(time*0.0002+c.x)*7;ctx.beginPath();ctx.arc(c.x+s,c.y,30,0,Math.PI*2);ctx.arc(c.x+s+24,c.y-5,24,0,Math.PI*2);ctx.arc(c.x+s+45,c.y,26,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle='#8dbc8f';ctx.beginPath();ctx.moveTo(-20,H*0.72);ctx.quadraticCurveTo(W*0.2,H*0.55,W*0.38,H*0.65);ctx.quadraticCurveTo(W*0.55,H*0.48,W*0.7,H*0.62);ctx.quadraticCurveTo(W*0.85,H*0.52,W+20,H*0.58);ctx.lineTo(W+20,H+20);ctx.lineTo(-20,H+20);ctx.fill();
    ctx.fillStyle='#4a8c4a';ctx.fillRect(0,H-18,W,28);for(let i=0;i<100;i++){let gx=i*W/100;ctx.strokeStyle='#3d7a3d';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(gx,H-14);ctx.quadraticCurveTo(gx+1.5,H-26,gx+0.8,H-32);ctx.stroke();}
    drawFlowers(time); drawTree(); drawHive();
  }

  function drawOverlay(){
    if(currentOverlayText==='star'){
      ctx.save();ctx.font='bold 20px "PingFang SC","Microsoft YaHei","SimHei",sans-serif';ctx.fillStyle='#FFD700';ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=3;ctx.textAlign='center';ctx.fillText('铁血军魂 · 一生荣光',W/2,H/2+95);ctx.shadowBlur=0;ctx.restore();
    }
    if(stage==='text_formed'){
      ctx.save();
      ctx.font='bold 34px "PingFang SC","Microsoft YaHei","SimHei",sans-serif';ctx.fillStyle='#2d4f1e';ctx.shadowColor='rgba(255,255,255,0.8)';ctx.shadowBlur=4;ctx.textAlign='center';ctx.fillText('一生戎马，半世蜂甜',W/2,H-150);
      ctx.font='bold 25px "PingFang SC","Microsoft YaHei","SimHei",sans-serif';ctx.fillStyle='#DAA520';ctx.shadowColor='rgba(0,0,0,0.3)';ctx.fillText('祝 公 公 生 日 快 乐',W/2,H-105);ctx.shadowBlur=0;ctx.restore();
    }
  }

  // ==================== 主循环 ====================
  function animate(timestamp){
    ctx.clearRect(0,0,W,H);drawBackground(timestamp);
    let now=performance.now();

    if(redPhase==='fading_in'){
      let t=Math.min((now-starFormedTime)/1000,1);
      let body=lerpC('#f5c542','#C41E3A',t),head=lerpC('#f5c542','#C41E3A',t),stripe=lerpC('#3b2e1e','#5a1020',t);
      let wingR=Math.round(lerpA(255,220,t)),wingG=Math.round(lerpA(255,40,t)),wingB=Math.round(lerpA(255,40,t)),wingA=lerpA(0.72,0.65,t);
      let wing=`rgba(${wingR},${wingG},${wingB},${wingA})`;
      updateBeeCache(body,head,stripe,wing);
      if(t>=1){redPhase='holding';starFormedTime=now;}
    }else if(redPhase==='holding'){
      if((now-starFormedTime)/1000>=3){redPhase='fading_out';starFormedTime=now;}
    }else if(redPhase==='fading_out'){
      let t=Math.min((now-starFormedTime)/1000,1);
      let body=lerpC('#C41E3A','#f5c542',t),head=lerpC('#C41E3A','#f5c542',t),stripe=lerpC('#5a1020','#3b2e1e',t);
      let wingR=Math.round(lerpA(220,255,t)),wingG=Math.round(lerpA(40,255,t)),wingB=Math.round(lerpA(40,255,t)),wingA=lerpA(0.65,0.72,t);
      let wing=`rgba(${wingR},${wingG},${wingB},${wingA})`;
      updateBeeCache(body,head,stripe,wing);
      if(t>=1){redPhase='done';updateBeeCache('#f5c542','#f5c542','#3b2e1e','rgba(255,255,255,0.72)');}
    }

    bees.forEach(b=>b.update());bees.forEach(b=>b.draw(ctx));petals.forEach(p=>{p.update();p.draw(ctx);});

    if(stage==='flying_to_star'){
      let ratio=getArrivalRatio(starPoints,2);
      if(ratio>=1.0||(now-stageStartTime>6000&&ratio>0.95)){stage='star_formed';starFormedTime=now;redPhase='fading_in';currentOverlayText='star';stageStartTime=now;}
    }
    if(stage==='star_formed'){
      if(redPhase==='done'&&now-stageStartTime>200){
        currentOverlayText='none';stage='flying_to_text';stageStartTime=now;
        let rawPoints;
        if(isPortrait()){
          cachedTextPoints=null;
          rawPoints=generateTwoLineTextPoints('公公','生日快乐',W/2,H/2-30,100,120);
        }else{
          cachedTextPoints=null;
          rawPoints=generateTextPoints('公公生日快乐',W/2,H/2-40,130);
        }
        let textCount;
        if (isPortrait()) {
          textCount = isMobile() ? 366 : 360;
        } else {
          textCount = 384;
        }
        textPoints=sampleEvenly(rawPoints, textCount);
        bees.forEach((b,i)=>{
          if(i<textPoints.length)b.setTarget(textPoints[i].x,textPoints[i].y);
          else{let a=(i/bees.length)*Math.PI*2;b.setTarget(W/2+Math.cos(a)*200,H/2+Math.sin(a)*80);}
        });
      }
    }
    if(stage==='flying_to_text'){
      let ratio=getArrivalRatio(textPoints,4);
      if(ratio>0.95||(now-stageStartTime>3000&&ratio>0.8)){stage='text_formed';stageStartTime=now;}
    }

    drawOverlay();animFrame=requestAnimationFrame(animate);
  }

  // ==================== 启动 ====================
  function startAnimation(){
    startBtn.style.display='none';resizeCanvas();initHive();createFlowers();
    petals=[];for(let i=0;i<16;i++)petals.push(new Petal());
    let total;
    if (isPortrait()) {
      total = isMobile() ? 366 : 360;
    } else {
      total = 384;
    }
    bees=[];let hi=0;
    for(let i=0;i<total;i++){let hole=hiveHoles[hi%7];hi++;bees.push(new Bee(hole.x+(Math.random()-0.5)*10,hole.y+(Math.random()-0.5)*10));}
    starPoints=generateStarPoints(W/2,H/2-50,155,60);let ss=sampleEvenly(starPoints, total);
    bees.forEach((b,i)=>{if(i<ss.length)b.setTarget(ss[i].x,ss[i].y);else{let a=(i/bees.length)*Math.PI*2;b.setTarget(W/2+Math.cos(a)*200,H/2+Math.sin(a)*80);}});
    starPoints=ss;stage='flying_to_star';stageStartTime=performance.now();currentOverlayText='none';
    playMusic();animFrame=requestAnimationFrame(animate);
  }

  function resizeCanvas(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;}
  window.addEventListener('resize',()=>{resizeCanvas();initHive();createFlowers();});
  startBtn.addEventListener('click',startAnimation);
  resizeCanvas();initHive();createFlowers();drawBackground(0);
})();
</script>
